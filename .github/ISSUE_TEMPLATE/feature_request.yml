name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the user flow and examples. Please distinguish supported behavior from ideas.
    validations:
      required: true
