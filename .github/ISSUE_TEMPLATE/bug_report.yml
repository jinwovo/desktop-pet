name: Bug report
description: Report a reproducible problem with motion, notifications, installation or settings.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and a small reproduction. Do not include real conversations or tokens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DesktopPet version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, character, monitor DPI/refresh rate, and assistant version when relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Recording or synthetic logs
      description: Redact personal paths and credentials.
