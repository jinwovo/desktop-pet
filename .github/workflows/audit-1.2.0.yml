name: Audit public 1.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-1.2.0.yml"
      - "scripts/audit-public-release.ps1"
      - "tests/public-release-audit-regression.ps1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Diagnose original post-publication failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'original-publication-failure.txt'
          gh run view 44684227455 --repo jinwovo/desktop-pet --job 136116214447 --log-failed 1> $log 2> $null
          if ($LASTEXITCODE -eq 0) {
            $lines = @(Get-Content -LiteralPath $log)
            $failureLine = @($lines | Select-String -Pattern 'FullyQualifiedErrorId.*WebCmdletWebResponseException' | Select-Object -First 1)
            if ($failureLine.Count) {
              $end = $failureLine[0].LineNumber - 1
              $begin = [Math]::Max(0, $end - 18)
              $detail = $lines[$begin..$end] -join "`n"
              $safe = $detail.Replace($env:GH_TOKEN, '***').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host ('::notice::Original publication failure context: ' + $safe)
            }
          } else { Write-Host '::warning::Original failed log unavailable; asset audit will still run.' }
          exit 0
      - name: Check audit guards offline
        run: |
          ./tests/public-release-audit-regression.ps1
      - uses: actions/download-artifact@v4
        with:
          name: DesktopPet-public-windows
          run-id: 44684227455
          github-token: ${{ github.token }}
          path: release-files
      - name: Compare existing public files with verified CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try { ./scripts/audit-public-release.ps1 -AuditOneTwo }
          catch {
            $safe = ($_.Exception.Message + ' at ' + $_.InvocationInfo.PositionMessage).Replace($env:GH_TOKEN, '***').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ('::error::Public audit failed: ' + $safe)
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-1.2.0-public-audit
          path: public-release-audit.json
          if-no-files-found: error
