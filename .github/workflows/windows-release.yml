name: Windows distribution

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Hooks/**"
      - "Assets/**"
      - "DesktopPet.sln"
      - "global.json"
      - ".gitattributes"
      - ".editorconfig"
      - "character-packs/**"
      - "README*"
      - "docs/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: NVIDIA work helper offline checks
        run: |
          python -m unittest discover -s tests -p test_nvidia_work.py -v
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA work helper checks failed' }
      - name: Read source version
        run: |
          [xml]$project = Get-Content src/DesktopPet.App/DesktopPet.App.csproj
          $releaseVersion = [string]$project.Project.PropertyGroup.Version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid source version' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DESKTOPPET_RELEASE_VERSION=$releaseVersion"
      - name: Restore and build
        run: |
          dotnet restore DesktopPet.sln
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build DesktopPet.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Core regression checks
        run: |
          dotnet tests/DesktopPet.RegressionTests/bin/Release/net10.0-windows/DesktopPet.RegressionTests.dll
          if ($LASTEXITCODE -ne 0) { throw "Core checks failed" }
      - name: UI regression checks
        run: |
          dotnet tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/DesktopPet.UiSmokeTests.dll --capture
          if ($LASTEXITCODE -ne 0) { throw "UI checks failed" }
      - name: Hook regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/assistant-hooks-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Hook regression checks failed' }
      - name: Release package regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/package-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release package regression checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/stable-publication-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Stable publication guard checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/evolution-release-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Evolution publication guard checks failed' }
      - name: Installer regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/install-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression checks failed' }
      - name: Sprite geometry regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/character-builder-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Sprite geometry regression checks failed' }
      - name: Directional artwork regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/companion-walk-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Directional artwork regression checks failed' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/personal-characters-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Personal artwork regression checks failed' }
      - name: Public character regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/public-characters-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public character regression checks failed' }
      - name: Public source regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/public-source-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public source regression checks failed' }
      - name: Notification command regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/notify-command-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Notification command regression checks failed' }
      - name: Public documentation regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/public-docs-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public documentation regression checks failed' }
      - name: Optional character pack regression checks
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/optional-pack-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Optional character pack regression checks failed' }
      - name: Private development artwork regression checks
        if: ${{ hashFiles('Assets/Characters/치이카와/character.json') != '' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/personal-characters-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Private development artwork regression checks failed' }
      - name: Verify UI with public assets only
        run: |
          $publicUi = Join-Path $env:RUNNER_TEMP "DesktopPet-public-ui"
          dotnet publish tests/DesktopPet.UiSmokeTests/DesktopPet.UiSmokeTests.csproj -c Release --no-restore -p:DistributionBuild=true -o $publicUi
          if ($LASTEXITCODE -ne 0) { throw "Public UI publish failed" }
          dotnet (Join-Path $publicUi "DesktopPet.UiSmokeTests.dll") --capture
          if ($LASTEXITCODE -ne 0) { throw "Public UI checks failed" }
      - name: Verify all nine characters and gallery
        run: |
          $personalUi = Join-Path $env:RUNNER_TEMP "DesktopPet-nine-character-ui"
          dotnet publish tests/DesktopPet.UiSmokeTests/DesktopPet.UiSmokeTests.csproj -c Release --no-restore -p:PersonalBuild=true -o $personalUi
          if ($LASTEXITCODE -ne 0) { throw "Nine-character UI publish failed" }
          dotnet (Join-Path $personalUi "DesktopPet.UiSmokeTests.dll") --personal-pack --capture
          if ($LASTEXITCODE -ne 0) { throw "Nine-character UI checks failed" }
          dotnet (Join-Path $personalUi "DesktopPet.UiSmokeTests.dll") --gallery-capture
          if ($LASTEXITCODE -ne 0) { throw "Nine-character gallery capture failed" }
          Copy-Item -LiteralPath (Join-Path $personalUi 'character-gallery-v060.png') -Destination tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/character-gallery-v060.png
      - name: Create self-contained public ZIP
        run: ./scripts/package-release.ps1 -Version $env:DESKTOPPET_RELEASE_VERSION
      - name: Create optional character pack ZIP
        run: ./scripts/package-character-packs.ps1 -Version $env:DESKTOPPET_RELEASE_VERSION -OutputDirectory artifacts/releases
      - name: Verify character ZIP import against packaged collection
        run: |
          $archive = Join-Path 'artifacts/releases' ("DesktopPet-" + $env:DESKTOPPET_RELEASE_VERSION + "-fan-art-packs.zip")
          dotnet tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/DesktopPet.UiSmokeTests.dll --verify-archive $archive
          if ($LASTEXITCODE -ne 0) { throw "Packaged character ZIP import failed" }
      - name: Validate extracted release and startup
        run: |
          . ./scripts/package-release.ps1
          $archive = Get-Item ("./artifacts/releases/DesktopPet-" + $env:DESKTOPPET_RELEASE_VERSION + "-win-x64.zip")
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("DesktopPet-release-smoke-" + [Guid]::NewGuid().ToString("N"))
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot
          Test-DesktopPetReleasePayload -Directory $smokeRoot -ExpectedVersion $env:DESKTOPPET_RELEASE_VERSION -ExpectedDeployment "self-contained-single-file"
          $process = Start-Process -FilePath (Join-Path $smokeRoot "DesktopPet.App.exe") -ArgumentList "--version" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed" }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/installation-check-regression.ps1 -ApplicationPath (Join-Path $smokeRoot 'DesktopPet.App.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Actual release installation checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-public-windows
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-previews
          path: |
            tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/*-v4.png
            tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/live-rig-v8.png
            tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/character-walk-v8.html
            tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/gallery-fixture.png
            tests/DesktopPet.UiSmokeTests/bin/Release/net10.0-windows/character-gallery-v060.png
          if-no-files-found: ignore
